<div id="sim-cooling" data-viz-keep>
  <style>
    #sim-cooling .row { display: grid; grid-template-columns: 92px 1fr 80px; align-items: center; gap: 12px; margin: 12px 0; }
    #sim-cooling output { font-variant-numeric: tabular-nums; }
    #sim-cooling svg { width: 100%; height: auto; overflow: visible; }
    #sim-cooling text { fill: var(--text-secondary); font-size: 12px; }
    #sim-cooling .curve { fill: none; stroke: var(--viz-series-1); stroke-width: 3; }
    #sim-cooling .axis { stroke: var(--viz-axis); }
    #sim-cooling .plot { animation: cooling-enter 400ms ease-out; }
    @keyframes cooling-enter { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #sim-cooling .plot { animation: none; } }
  </style>
  <h3>咖啡冷却模拟</h3>
  <div class="row">
    <label for="cooling-rate">冷却速率</label>
    <input id="cooling-rate" name="rate" type="range" min="2" max="30" value="10">
    <output data-viz-out="rate"></output>
  </div>
  <div class="row">
    <label for="cooling-time">观察时长</label>
    <input id="cooling-time" name="minutes" type="range" min="15" max="120" step="5" value="60">
    <output data-viz-out="minutes"></output>
  </div>
  <p>结束温度：<output data-viz-out="end"></output>；降至 60°C 所需时间：<output data-viz-out="drink"></output></p>
  <svg viewBox="0 0 600 250" role="img" aria-label="温度随时间变化的曲线">
    <g class="plot">
      <path class="axis" d="M45 15V215H580" fill="none"></path>
      <text x="5" y="20">90°C</text><text x="5" y="217">22°C</text>
      <text x="45" y="240">0 分钟</text><text id="cooling-end-label" x="580" y="240" text-anchor="end"></text>
      <path id="cooling-curve" class="curve"></path>
    </g>
  </svg>
</div>
<script>
(function () {
  var root = document.getElementById('sim-cooling');
  var curve = root.querySelector('#cooling-curve');
  var label = root.querySelector('#cooling-end-label');
  dshViz.bind(root, function (p) {
    var k = p.rate / 100, points = [], end = 90;
    for (var i = 0; i <= 120; i++) {
      var time = p.minutes * i / 120;
      end = 22 + 68 * Math.exp(-k * time);
      points.push((i === 0 ? 'M' : 'L') + (45 + i * 535 / 120).toFixed(2) + ' ' + (215 - (end - 22) * 200 / 68).toFixed(2));
    }
    curve.setAttribute('d', points.join(' '));
    label.textContent = p.minutes + ' 分钟';
    return {
      rate: dshViz.fmt(k, { digits: 2, unit: '/min' }),
      minutes: p.minutes + ' 分钟',
      end: dshViz.fmt(end, { digits: 1, unit: '°C' }),
      drink: dshViz.fmt(Math.log(68 / 38) / k, { digits: 1, unit: ' 分钟' })
    };
  });
})();
</script>
